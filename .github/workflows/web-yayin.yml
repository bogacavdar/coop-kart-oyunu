name: Web'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Export şablonlarını yerleştir
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Projeyi içe aktar
        run: godot --headless --import 2>&1 | tee import.log || true

      - name: Savaş testini çalıştır
        run: timeout 300 godot --headless --script res://testler/savas_testi.gd 2>&1 | tee test.log || true

      - name: Arayüz testini çalıştır
        run: timeout 120 godot --headless --script res://testler/arayuz_testi.gd 2>&1 | tee calistir.log || true

      - name: Hataları kontrol et
        run: |
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|TEST HATASI" import.log test.log calistir.log; then
            echo "Kodda hata bulundu"; exit 1
          fi
          grep -q "TEST TAMAM" test.log || { echo "Test tamamlanmadı"; exit 1; }
          grep -q "ARAYUZ TESTI TAMAM" calistir.log || { echo "Arayüz testi tamamlanmadı"; exit 1; }

      - name: Web sürümünü derle
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log

      - name: Windows sürümünü derle
        continue-on-error: true
        run: |
          mkdir -p build/windows build/web/indir
          godot --headless --export-release "Windows" build/windows/EjderinIni.exe 2>&1 | tee windows.log
          ls -la build/windows
          (cd build/windows && zip -9 -r ../web/indir/EjderinIni-Windows.zip .) || python3 -c "import shutil; shutil.make_archive('build/web/indir/EjderinIni-Windows', 'zip', 'build/windows')"

      - name: Android sürümünü (APK) derle
        continue-on-error: true
        run: |
          mkdir -p ~/.config build/android build/web/indir
          cp -r /root/.config/godot ~/.config/ 2>/dev/null || true
          ls ~/.config/godot || true
          godot --headless --export-debug "Android" build/android/EjderinIni.apk 2>&1 | tee android.log
          ls -la build/android
          cp build/android/EjderinIni.apk build/web/indir/

      - name: İndirme sayfası
        run: |
          mkdir -p build/web/indir
          cat > build/web/indir/index.html <<'HTML'
          <!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Ejderin İni - İndir</title>
          <style>body{background:#15110d;color:#e8e0f8;font-family:sans-serif;text-align:center;padding:40px}
          a{display:block;margin:18px auto;max-width:340px;padding:18px;background:#5c4720;color:#ffe39a;border:2px solid #e8c27a;border-radius:12px;text-decoration:none;font-size:20px}
          small{color:#a8a0c0}</style></head><body>
          <h1 style="color:#e8c27a">Ejderin İni</h1>
          <a href="../">Tarayıcıda oyna</a>
          <a href="EjderinIni-Windows.zip">Windows (.zip)</a>
          <a href="EjderinIni.apk">Android (.apk)</a>
          <small>Windows: zip'i aç, EjderinIni.exe'yi çalıştır. Android: APK'yı indirip yükle (bilinmeyen kaynaklara izin vermen gerekebilir).</small>
          </body></html>
          HTML
          ls -la build/web/indir

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
