name: Web'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Export şablonlarını yerleştir
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Projeyi içe aktar
        run: godot --headless --import 2>&1 | tee import.log || true

      - name: Savaş testini çalıştır
        run: timeout 300 godot --headless --script res://testler/savas_testi.gd 2>&1 | tee test.log || true

      - name: Arayüz testini çalıştır
        run: timeout 120 godot --headless --script res://testler/arayuz_testi.gd 2>&1 | tee calistir.log || true

      - name: Hataları kontrol et
        run: |
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|TEST HATASI" import.log test.log calistir.log; then
            echo "Kodda hata bulundu"; exit 1
          fi
          grep -q "TEST TAMAM" test.log || { echo "Test tamamlanmadı"; exit 1; }
          grep -q "ARAYUZ TESTI TAMAM" calistir.log || { echo "Arayüz testi tamamlanmadı"; exit 1; }

      - name: Web sürümünü derle
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
